<!-- 8: 调色盘提取 -->
<section class="page-section" id="page-palette" data-page="palette">

  <div class="palette-app" id="paletteApp">
    <!-- 顶部操作栏 -->
    <div class="palette-header">
      <div class="palette-brand" data-i18n="paletteBrand">PhotoColors</div>
      <div class="palette-header-actions">
        <button class="palette-header-btn" id="paletteUploadBtn" title="上传图片" aria-label="上传图片">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button class="palette-header-btn" id="paletteDownloadBtn" title="保存合成图" aria-label="保存合成图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>
        <button class="palette-header-btn" id="paletteResetBtn" title="重新上传" aria-label="重新上传">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
        </button>
      </div>
    </div>

    <!-- 空状态 -->
    <div class="palette-empty" id="paletteEmptyState">
      <div class="palette-empty-circles">
        <div class="palette-empty-circle"></div>
        <div class="palette-empty-circle"></div>
        <div class="palette-empty-circle"></div>
      </div>
      <h1 class="palette-empty-title" data-i18n="paletteEmptyTitle">Moments in Living Color</h1>
      <p class="palette-empty-desc" data-i18n="paletteEmptyDesc">为每一刻生动的瞬间，赋予它独一无二的色彩。</p>
      <button class="palette-upload-main" id="paletteUploadMainBtn" aria-label="上传图片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <input type="file" id="paletteFileInput" accept="image/*" style="display:none">
    </div>

    <!-- 结果状态 -->
    <div class="palette-result" id="paletteResultState">
      <div class="palette-result-meta">
        <div class="palette-result-title" id="paletteResultTitle"></div>
        <div class="palette-result-subtitle" id="paletteResultSubtitle"></div>
      </div>
      <div class="palette-image-card" id="paletteImageCard">
        <img id="paletteResultImg" alt="palette result">
      </div>
    </div>
  </div>

  <div class="palette-toast" id="paletteToast"></div>

</section>
